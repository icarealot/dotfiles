[general]
working_directory = ""
live_config_reload = true

[window]
dynamic_padding = false
startup_mode = "Maximized"
# option_as_alt = "Both"

[window.padding]
x = 10
y = 10

[font]
size = 13

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Medium Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"
